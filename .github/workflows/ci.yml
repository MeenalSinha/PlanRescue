name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ENCRYPTION_SECRET: 'ci-pipeline-test-encryption-secret-32-chars-long!'
      SESSION_SECRET: 'ci-pipeline-test-session-secret-32-chars-long!'
      SEED_SAMPLE_DATA: 'true'
      APP_ENV: 'test'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/vr/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build and run all backend tests (unit + real MCP client over Streamable HTTP)
        run: npm test
      - name: Verify automated database backup and restore
        run: npx vitest run tests/backupRestore.test.ts
      - name: Install the web interface
        run: npm --prefix apps/web install --legacy-peer-deps
      - run: npm run typecheck:web
      - name: Build the web interface and run its tests (component, integration and end-to-end against the real MCP server)
        run: npm run test:web
      - name: Install the spatial VR application
        run: npm --prefix apps/vr install --legacy-peer-deps --ignore-scripts
      - run: npm run vr:typecheck
      - name: Run all spatial VR tests (Three.js, WebXR, hand interactions, accessibility, optimization)
        run: npm run vr:test
      - name: Verify production build for spatial VR app
        run: npm run vr:build
      - name: Verify zero mock tokens, dummy fallbacks, or secrets in production distribution
        run: npm run audit:leaks
