name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Build and run all backend tests (unit + real MCP client over Streamable HTTP)
        run: npm test
      - name: Install the web interface
        working-directory: apps/web
        run: npm ci --verbose
      - run: npm run typecheck:web
      - name: Build the web interface and run its tests (component, integration and end-to-end against the real MCP server)
        run: npm run test:web
